name: Build Installers

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows x64 unsigned NSIS
    runs-on: windows-2022
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install UI dependencies and locked Tauri CLI
        working-directory: ui
        run: npm ci
      - name: Build unsigned NSIS installer (includes UI build)
        working-directory: ui
        run: npm run tauri -- build --ci --no-sign --target x86_64-pc-windows-msvc --bundles nsis -- --locked
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64-nsis-unsigned
          path: target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

  android:
    name: Android arm64 debug-signed APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      NDK_VERSION: '28.2.13676358'
      BUILD_TOOLS_VERSION: '36.0.0'
      ANDROID_API_LEVEL: '36'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          # The action default includes the removed legacy SDK package "tools".
          packages: 'platform-tools'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - name: Install Linux host prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config clang libclang-dev libwebkit2gtk-4.1-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libasound2-dev
      - name: Install Android tools and export NDK location
        run: |
          sdkmanager "platform-tools" "build-tools;$BUILD_TOOLS_VERSION" "ndk;$NDK_VERSION"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          # Bindgen must parse Android headers, not the runner's Linux headers.
          min_sdk=$(node -p "require('./crates/tauri-app/tauri.conf.json').bundle.android.minSdkVersion")
          # CPAL uses AAudio, which is available starting at API 26.
          test "$min_sdk" -ge 26
          test -f "$ANDROID_HOME/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/$min_sdk/libaaudio.so"
          echo "BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android=--sysroot=$ANDROID_HOME/ndk/$NDK_VERSION/toolchains/llvm/prebuilt/linux-x86_64/sysroot --target=aarch64-linux-android$min_sdk" >> "$GITHUB_ENV"
      - name: Install UI dependencies and locked Tauri CLI
        working-directory: ui
        run: npm ci
      - name: Initialize missing Android host
        working-directory: ui
        run: |
          if [ ! -f ../crates/tauri-app/gen/android/gradlew ]; then
            npm run tauri -- android init --ci --skip-targets-install
          fi
      - name: Pin generated host to available Android SDK
        run: |
          gradle_file=crates/tauri-app/gen/android/app/build.gradle.kts
          # The CLI template can reference an SDK not yet published to sdkmanager.
          sed -i -E "s/^([[:space:]]*)(compileSdk|targetSdk) = [0-9]+/\1\2 = $ANDROID_API_LEVEL/" "$gradle_file"
          grep -Eq "^[[:space:]]*compileSdk = $ANDROID_API_LEVEL[[:space:]]*$" "$gradle_file"
          grep -Eq "^[[:space:]]*targetSdk = $ANDROID_API_LEVEL[[:space:]]*$" "$gradle_file"
          sdkmanager "platforms;android-$ANDROID_API_LEVEL"
      - name: Build installable debug APK (includes UI build)
        working-directory: ui
        run: npm run tauri -- android build --ci --debug --apk --target aarch64 -- --locked
      - name: Verify APK signatures
        shell: bash
        run: |
          shopt -s nullglob globstar
          apks=(crates/tauri-app/gen/android/app/build/outputs/apk/**/debug/*.apk)
          if [ "${#apks[@]}" -eq 0 ]; then
            echo "No debug APK was produced" >&2
            exit 1
          fi
          for apk in "${apks[@]}"; do
            "$ANDROID_HOME/build-tools/$BUILD_TOOLS_VERSION/apksigner" verify --verbose "$apk"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: android-arm64-apk-debug-signed
          path: crates/tauri-app/gen/android/app/build/outputs/apk/**/debug/*.apk
          if-no-files-found: error
          retention-days: 14
